name: hall-pass
description: Classifies pull requests and approves and auto-merges the low-risk ones.
author: garfieldmoore

inputs:
  github-token:
    description: Installation token for the GitHub App hall-pass acts as (from actions/create-github-app-token).
    required: true
  review-token:
    description: >-
      Token to post and dismiss the approving review with, when the review has to come from a user
      rather than the App. CODEOWNERS recognises users and teams, so only a member of the owning team
      satisfies a code-owner requirement — an App's review never does, however the App is installed.
      Needs Pull requests read and write. The check run stays on github-token either way, because
      creating one is open to Apps alone. Defaults to github-token, which keeps the single-identity
      behaviour.
    required: false
  config:
    description: Path to the config file, read from the PR's base commit.
    required: false
    default: .github/hall-pass.yml
  dry-run:
    description: Report only (check run and comment); take no label, approval or auto-merge actions.
    required: false
    default: "false"

outputs:
  eligible:
    description: "true or false: whether the PR qualifies for auto-merge."
  categories:
    description: JSON array of qualifying categories.
  decision:
    description: The full Decision as JSON.

runs:
  using: node24
  main: dist/index.js
